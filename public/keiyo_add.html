<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>駅の追加</title>
</head>
<body>
    <h2>京葉線の駅を追加</h2>

    <form action="/keiyo_add" method="GET">
        <p>ID: <input type="number" name="id" required></p>
        <p>Code: <input type="text" name="code" required></p>
        <p>駅名: <input type="text" name="name" required></p>
        <input type="submit" value="登録">
    </form>
</body>
</html>
